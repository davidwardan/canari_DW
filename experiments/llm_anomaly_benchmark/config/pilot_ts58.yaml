# Single-series pilot.
#
# Identical to benchmark.yaml except:
#   series           -> ts58 only (shortest, and mid-range in the companion
#                       experiment: peak excess-over-chance 0.50, 0.23 false
#                       alarms/yr -- neither a flattering nor a pathological case)
#   cdf_num_anomaly  -> 10 instead of 50
#
# cdf_num_anomaly only makes the *tuning* objective noisier; it never enters the
# reported results, and TPE is built for noisy objectives. It cuts the SKF search
# from 55.7 h to 11.6 h. The evaluation stays at full upstream fidelity:
# 7 magnitudes x 25 realizations x 2 directions.
#
# A single series is a PILOT, not a benchmark point: the upstream LSTM conditions
# average over series and seeds, so this number is not directly comparable to them.

experiment_name: llm_anomaly_benchmark_pilot_ts58
values_file: data/hq_benchmark_data/weekly/weekly_values.csv
datetimes_file: data/hq_benchmark_data/weekly/weekly_datetimes.csv
series:
- ts58
global_warmup_lookback_len: 52
baseline_init_len: 52
validation_ratio: 0.15
test_ratio: 0.5
model_id: amazon/chronos-2
llm_horizon: 1
llm_horizon_search_space: [1, 3, 6, 13, 26, 52, 104, 208]
optimize_sigma_v: true
sigma_v: 0.1
sigma_v_search_space:
- 0.01
- 0.02
- 0.04
- 0.06
- 0.08
- 0.1
- 0.125
- 0.15
- 0.175
- 0.2
sigma_v_selection_delta: 0.0
early_stopping_metric: crps
optimize_skf_parameters: true
skf_objective_function: cdf
num_optimization_trial: 50
num_startup_trials: 20
std_transition_error: 1.0e-05
norm_to_abnorm_prob: 1.0e-05
abnorm_to_norm_prob: 0.1
anomaly_detection_threshold: 0.4
std_transition_error_search_space:
- 5.0e-06
- 0.0001
norm_to_abnorm_prob_search_space:
- 1.0e-05
- 0.0001
abnorm_to_norm_prob_search_space:
- 0.1
- 0.2
threshold_search_space:
- 0.05
- 0.5
slope: 0.5
cdf_num_anomaly: 10
cdf_anomaly_start: 0.25
cdf_anomaly_end: 0.75
objective_detection_rate_cdf_mean: 0.5
objective_detection_rate_cdf_std: 0.2
objective_false_rate_cdf_median: 0.1
objective_false_rate_cdf_shape: 0.2
objective_anm_mag_cdf_median: 0.2
objective_anm_mag_cdf_shape: 0.6
num_anomaly_realizations: 25
slope_search_space:
- 0.025
- 0.05
- 0.075
- 0.225
- 0.5
evaluation_magnitudes:
- 0.025
- 0.05
- 0.075
- 0.225
- 0.5
- 0.75
- 1.0
max_timestep_to_detect: 156
seeds:
- 0
num_workers: null                 # per-case CPU budget; set automatically when
                                  # the driver runs cases in parallel
max_concurrent: null              # (H, series) cases to run side by side.
                                  # null -> chosen to minimise wall clock, since
                                  # H=1 costs far more than H=208 and one core
                                  # each would leave it setting the wall time.

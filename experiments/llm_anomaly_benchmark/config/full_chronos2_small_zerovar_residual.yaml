- 0.225
- 0.5
evaluation_magnitudes:
- 0.025
- 0.05
- 0.075
- 0.225
- 0.5
- 0.75
- 1.0
max_timestep_to_detect: 156
seeds:
- 0
num_workers: null
max_concurrent: 11
cpus: 44
ray_object_store_mb: 256
zero_llm_variance: true
feed_observed_residual: true
save_skf_figures: true

# pilot_2series_chronos2_small_zerovar_residual.yaml on all 10 series, without
# H=1. Chronos-2 small with its predictive variance set to zero, and the context
# fed back as c_post + w_post (= y - level_post).
# H=1 is dropped: in the 2-series pilot the filter diverged at H=1 for some large
# (magnitude 1.0) realizations -- Chronos extrapolates the residual, the level
# compensates, and the fed-back residual grows without bound.
#
# save_skf_figures: one random realization per (series, H, magnitude) is plotted
# to figures/<run dir name>/<series>/H<h>_mag<m>_r<index>.pdf.
#
#   python scripts/benchmark.py --config_path config/full_chronos2_small_zerovar_residual.yaml
#
experiment_name: llm_anomaly_benchmark_full_chronos2_small_zerovar_residual
values_file: data/hq_benchmark_data/weekly/weekly_values.csv
datetimes_file: data/hq_benchmark_data/weekly/weekly_datetimes.csv
series: null
global_warmup_lookback_len: 52
baseline_init_len: 52
validation_ratio: 0.15
test_ratio: 0.5
model_id: autogluon/chronos-2-small
llm_horizon: 1
llm_horizon_search_space:
- 3
- 6
- 13
- 26
- 52
- 104
- 208
optimize_sigma_v: true
sigma_v: 0.1
sigma_v_search_space:
- 0.01
- 0.02
- 0.04
- 0.06
- 0.08
- 0.1
- 0.125
- 0.15
- 0.175
- 0.2
sigma_v_selection_delta: 0.0
early_stopping_metric: ll
optimize_skf_parameters: true
skf_objective_function: cdf
num_optimization_trial: 100
num_startup_trials: 50
std_transition_error: 1.0e-05
norm_to_abnorm_prob: 1.0e-05
abnorm_to_norm_prob: 0.1
anomaly_detection_threshold: 0.4
std_transition_error_search_space:
- 5.0e-06
- 0.001
norm_to_abnorm_prob_search_space:
- 1.0e-05
- 0.0001
abnorm_to_norm_prob_search_space:
- 0.1
- 0.2
threshold_search_space:
- 0.05
- 0.5
slope: 0.5
cdf_num_anomaly: 50
cdf_anomaly_start: 0.25
cdf_anomaly_end: 0.75
objective_detection_rate_cdf_mean: 0.5
objective_detection_rate_cdf_std: 0.2
objective_false_rate_cdf_median: 0.1
objective_false_rate_cdf_shape: 0.2
objective_anm_mag_cdf_median: 0.2
objective_anm_mag_cdf_shape: 0.6
num_anomaly_realizations: 25
slope_search_space:
- 0.025
- 0.05
